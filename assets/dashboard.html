<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sentinela · Perícia de carga</title>
<style>
:root{--bg:#0e1116;--panel:#161b22;--panel2:#1d242d;--line:#2a323d;--tx:#e6edf3;--mut:#8b98a8;
--ok:#3fb68b;--warn:#e3a008;--bad:#f0616d;--info:#5aa2ff;--demo:#b88cff;
--c1:#5aa2ff;--c2:#e3a008;--c3:#3fb68b;--c4:#f0616d;--c5:#b88cff;--c6:#4cc9d6;--c7:#ff8fb1;--c8:#a3b18a;}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f5f7fa;--panel:#fff;--panel2:#eef2f6;--line:#d5dce5;--tx:#17202b;--mut:#5c6b7c;
--ok:#12805c;--warn:#a86a00;--bad:#c2303d;--info:#1d60c4;--demo:#7a45d1;--c1:#1d60c4;--c2:#a86a00;--c3:#12805c;--c4:#c2303d;--c5:#7a45d1;--c6:#0f7f8c;--c7:#c23a6b;--c8:#667a50}}
:root[data-theme=light]{--bg:#f5f7fa;--panel:#fff;--panel2:#eef2f6;--line:#d5dce5;--tx:#17202b;--mut:#5c6b7c;--ok:#12805c;--warn:#a86a00;--bad:#c2303d;--info:#1d60c4;--demo:#7a45d1;--c1:#1d60c4;--c2:#a86a00;--c3:#12805c;--c4:#c2303d;--c5:#7a45d1;--c6:#0f7f8c;--c7:#c23a6b;--c8:#667a50}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:1240px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}h2{font-size:15px;margin:0 0 10px;letter-spacing:.2px}h3{font-size:13px;margin:14px 0 6px;color:var(--mut);font-weight:600}
.sub{color:var(--mut);font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
@media(max-width:900px){.g2,.g3,.g4,.g6{grid-template-columns:1fr 1fr}}@media(max-width:560px){.g2,.g3,.g4,.g6{grid-template-columns:1fr}}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.4px;border:1px solid currentColor}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.info{color:var(--info)}.demo{color:var(--demo)}.mut{color:var(--mut)}
.banner{border:2px dashed var(--demo);color:var(--demo);padding:10px 14px;border-radius:10px;font-weight:700;text-align:center;margin:12px 0}
.verdict{border-left:6px solid var(--mut)}
.verdict.GERADOR_COMPROMETIDO{border-color:var(--warn)}.verdict.CONECTIVIDADE_PROVAVEL{border-color:var(--warn)}.verdict.ALVO_SATURADO_CONFIRMADO,.verdict.ALVO_SATURADO_PROVAVEL{border-color:var(--bad)}.verdict.SEM_SATURACAO{border-color:var(--ok)}.verdict.INCONCLUSIVO,.verdict.ABORTADO{border-color:var(--info)}
.big{font-size:19px;font-weight:700;line-height:1.3}
.kpi{background:var(--panel2);border-radius:8px;padding:10px 12px}.kpi b{display:block;font-size:20px}.kpi span{font-size:11px;color:var(--mut)}
table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:600;font-size:11.5px}
.scroll{overflow-x:auto}
.bar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}.bar i{display:block;height:100%}
.sus{display:grid;grid-template-columns:190px 1fr 40px;gap:10px;align-items:center;margin:7px 0}
@media(max-width:560px){.sus{grid-template-columns:110px 1fr 34px}}
details{margin:4px 0}summary{cursor:pointer;color:var(--mut);font-size:12px}
ul{margin:6px 0;padding-left:20px}li{margin:3px 0}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;margin:2px 0 4px}
.legend span b{font-variant-numeric:tabular-nums}
svg text{fill:var(--mut);font-size:10.5px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
select,button{background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font:inherit;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rec{display:grid;grid-template-columns:28px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.rec .n{width:24px;height:24px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-weight:700;font-size:12px}
.tag{font-size:10.5px;padding:1px 7px;border-radius:5px;background:var(--panel2);color:var(--mut);margin-left:6px}
</style>
</head>
<body>
<main id="app"></main>
<script>
const M = /*__DATA__*/null;
/* ===== utilidades ===== */
const $=(s,r=document)=>r.querySelector(s);
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const k in (attrs||{})){if(k==='class')e.className=attrs[k];else if(k==='html')e.innerHTML=attrs[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k]);}
 for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c));}return e;}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f1=v=>v==null?'—':(Math.abs(v)>=100?Math.round(v).toLocaleString('pt-BR'):(+v).toLocaleString('pt-BR',{maximumFractionDigits:1}));
const fms=v=>v==null?'—':(v>=1000?(v/1000).toFixed(2)+' s':f1(v)+' ms');
const fpc=v=>v==null?'—':(v*100).toLocaleString('pt-BR',{maximumFractionDigits:2})+'%';
const fbps=v=>v==null?'—':(v>=1e6?(v*8/1e6).toFixed(1)+' Mb/s':(v*8/1e3).toFixed(0)+' kb/s');
const col=i=>`var(--c${(i%8)+1})`;
const KIND={measured:['MEDIDO','ok','●'],estimated:['ESTIMADO','warn','◐'],demo:['DEMO','demo','◇'],ingested:['IMPORTADO','info','↧']};
function chip(kind){const k=KIND[(kind||'').split('(')[0]]||KIND.measured;return h('span',{class:'chip '+k[1],title:kind},k[2]+' '+k[0]);}
const V=M.verdict||{},R=M.run||{},T=M.totals||{},REL=M.reliability||{};
const STATE={GERADOR_COMPROMETIDO:['GERADOR COMPROMETIDO','warn','O resultado não prova nada sobre o alvo.'],ALVO_SATURADO_CONFIRMADO:['ALVO SATURADO · confirmado','bad',''],ALVO_SATURADO_PROVAVEL:['ALVO SATURADO · provável','bad',''],CONECTIVIDADE_PROVAVEL:['CONECTIVIDADE / ROTA · provável','warn',''],SEM_SATURACAO:['SEM SATURAÇÃO observada','ok',''],INCONCLUSIVO:['INCONCLUSIVO','info',''],ABORTADO:['TESTE ABORTADO','info','']};
const LAYER_PT={edge:'borda / LB / estático',app:'aplicação (sem banco)',db:'banco de dados',cache:'cache',queue:'fila',external:'serviço externo',unknown:'sem camada'};

/* ===== gráficos de linha com cursor sincronizado ===== */
const CHARTS=[];let CUR=null;
function setCursor(t){CUR=t;CHARTS.forEach(c=>c.cursor(t));}
function lineChart(host,o){
 const Wd=Math.max(host.clientWidth||700,320),Ht=o.h||170,m={l:46,r:10,t:8,b:20};
 const pw=Wd-m.l-m.r,ph=Ht-m.t-m.b;
 const xmax=o.xmax||Math.max(1,...o.series.flatMap(s=>s.pts.map(p=>p[0])));
 let ymax=o.ymax;if(ymax==null){ymax=Math.max(1e-9,...o.series.flatMap(s=>s.pts.map(p=>p[1]).filter(v=>v!=null)));ymax*=1.1;}
 const X=x=>m.l+x/xmax*pw,Y=y=>m.t+ph-Math.min(y,ymax)/ymax*ph;
 const ns='http://www.w3.org/2000/svg';const svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox',`0 0 ${Wd} ${Ht}`);svg.setAttribute('width','100%');svg.style.display='block';
 const add=(t,a,txt)=>{const e=document.createElementNS(ns,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;svg.appendChild(e);return e;};
 for(let i=0;i<=4;i++){const y=ymax*i/4;add('line',{x1:m.l,x2:Wd-m.r,y1:Y(y),y2:Y(y),stroke:'var(--line)','stroke-width':1});add('text',{x:m.l-5,y:Y(y)+3,'text-anchor':'end'},(o.yfmt||f1)(y));}
 const step=[1,2,5,10,15,30,60,120,300,600,1800].find(s=>xmax/s<=10)||3600;
 for(let x=0;x<=xmax;x+=step)add('text',{x:X(x),y:Ht-5,'text-anchor':'middle'},x+'s');
 (o.shade||[]).forEach(([a,b,c])=>add('rect',{x:X(a),y:m.t,width:Math.max(1,X(b)-X(a)),height:ph,fill:c==='bad'?'var(--bad)':'var(--warn)',opacity:c==='bad'?.13:.10}));
 (o.marks||[]).forEach(mk=>{add('line',{x1:X(mk.x),x2:X(mk.x),y1:m.t,y2:m.t+ph,stroke:'var(--bad)','stroke-dasharray':'4 3'});add('text',{x:X(mk.x)+3,y:m.t+10,fill:'var(--bad)',style:'fill:var(--bad)'},mk.l);});
 const maps=[];
 o.series.forEach((s,i)=>{const mp=new Map(s.pts);maps.push(mp);let d='',pen=false;for(const [x,y] of s.pts){if(y==null){pen=false;continue;}d+=(pen?'L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1);pen=true;}
  add('path',{d,fill:'none',stroke:s.c||col(i),'stroke-width':s.w||1.6,'stroke-dasharray':s.dash||'','stroke-linejoin':'round'});});
 const cur=add('line',{x1:0,x2:0,y1:m.t,y2:m.t+ph,stroke:'var(--tx)',opacity:0,'stroke-width':1});
 const ov=add('rect',{x:m.l,y:m.t,width:pw,height:ph,fill:'transparent'});
 const leg=h('div',{class:'legend'});const vals=o.series.map((s,i)=>{const b=h('b',null,'—');leg.append(h('span',null,h('i',{class:'sw',style:`background:${s.c||col(i)}`}),s.n+' ',b));return b;});
 const ttl=h('div',{class:'row',style:'justify-content:space-between'},h('h3',{style:'margin:8px 0 2px'},o.title),o.note?h('span',{class:'sub'},o.note):null);
 const api={cursor(t){if(t==null){cur.setAttribute('opacity',0);return;}cur.setAttribute('x1',X(t));cur.setAttribute('x2',X(t));cur.setAttribute('opacity',.6);
   o.series.forEach((s,i)=>{const v=maps[i].get(t);vals[i].textContent=v==null?'—':(s.fmt||o.yfmt||f1)(v);});}};
 ov.addEventListener('mousemove',e=>{const r=svg.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*Wd;setCursor(Math.max(0,Math.min(xmax,Math.round((x-m.l)/pw*xmax))));});
 ov.addEventListener('mouseleave',()=>setCursor(null));
 host.replaceChildren(ttl,leg,svg);CHARTS.push(api);return api;
}

/* ===== seções ===== */
const app=$('#app');
function header(){
 const k=KIND[M.provenance]||KIND.measured;
 app.append(h('div',{class:'row',style:'justify-content:space-between'},
  h('div',null,h('h1',null,'Sentinela · '+(R.name||'')),h('div',{class:'sub'},`execução ${R.id||'—'} · ${R.started_at||''} → ${R.ended_at||''} · ${R.duration_actual_s??'—'}s (planejado ${R.duration_planned_s??'—'}s) · alvo ${R.target||'—'}`)),
  h('div',{class:'row'},chip(M.provenance),h('span',{class:'chip '+(R.status==='completed'?'ok':R.status==='failed'?'bad':'warn')},'STATUS: '+(R.status||'—').toUpperCase()),
   h('button',{onclick:()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='light'?'dark':'light';location.hash='';renderCharts();}},'◐ tema'))));
 if(M.provenance==='demo')app.append(h('div',{class:'banner'},'◇ DEMONSTRAÇÃO — dados SINTÉTICOS gerados para mostrar a interface. Não representam nenhum sistema real.'));
 if(M.provenance==='ingested')app.append(h('div',{class:'banner',style:'border-color:var(--info);color:var(--info)'},'↧ DADOS IMPORTADOS de outra ferramenta — sem telemetria do gerador; o veredito sobre o alvo é limitado.'));
 if(R.abort_reason)app.append(h('div',{class:'card',style:'border-color:var(--warn)'},h('b',{class:'warn'},'Por que isto parou: '),R.abort_reason));
}
function verdict(){
 const st=STATE[V.state]||[V.state,'info',''];
 const c=h('div',{class:'card verdict '+V.state});
 c.append(h('div',{class:'row'},h('span',{class:'chip '+st[1]},st[0]),h('span',{class:'sub'},'confiança: '+(V.confidence||'—')),
  h('span',{class:'sub'},'onde: '+(V.location||'—')),V.generator_ok===false?h('span',{class:'chip warn'},'⚠ gerador comprometido'):V.generator_ok?h('span',{class:'chip ok'},'✓ geradores íntegros em '+f1(V.trusted_pct)+'% das janelas'):h('span',{class:'chip info'},'gerador não medido')));
 c.append(h('p',{class:'big'},V.headline||''));
 if(V.how_to_read)c.append(h('p',{class:'sub'},V.how_to_read));
 if(V.generator_consequence)c.append(h('p',{class:'sub'},'ℹ O gerador degradou DEPOIS do alvo e por efeito dele (conexões/portas/descartes): consequência, não causa.'));
 app.append(c);
}
function kpis(){
 const cap=V.capacity||{};const g=REL.planned_vs_generated||{};
 const items=[
  ['Capacidade validada',cap.validated!=null?f1(cap.validated)+' req/s':'—',V.knee?'medida, antes do joelho':'≥ (limite não achado)','measured'],
  ['Pico efetivo',f1(Math.max(0,...(M.series||[]).map(s=>s.ok)))+' req/s','por segundo, medido','measured'],
  ['P95 / P99 (merge)',fms(T.p95)+' / '+fms(T.p99),'histogramas somados','measured'],
  ['Erros',fpc(T.err_rate),f1(T.err)+' de '+f1(T.sent),'measured'],
  ['Iterações descartadas',f1((T.drop_sched||0)+(T.drop_cap||0)),(T.drop_sched||0)+' gerador · '+(T.drop_cap||0)+' teto de VUs','measured'],
  ['Carga gerada vs planejada',g.generated_pct!=null?f1(g.generated_pct)+'%':'—',(M.infra.num_workers_effective??'—')+'/'+(M.infra.num_workers_planned??'—')+' workers','measured']];
 const gr=h('div',{class:'grid g6'});items.forEach(i=>gr.append(h('div',{class:'kpi'},h('span',null,i[0]),h('b',null,i[1]),h('span',null,i[2]+' '),chip(M.provenance==='demo'?'demo':i[3]))));
 app.append(gr);
}
function suspects(){
 const c=h('div',{class:'card'},h('h2',null,'Perícia — de quem é a limitação?'),h('div',{class:'sub'},'Pontuação 0–100 por evidência diferencial (não é probabilidade). Sem evidência = fica baixo. Tipo: '),);
 c.lastChild.append(chip('estimated'));
 (V.suspects||[]).forEach(s=>{
  const color=s.score>=60?'var(--bad)':s.score>=30?'var(--warn)':'var(--line)';
  c.append(h('div',{class:'sus'},h('div',null,s.layer),h('div',{class:'bar'},h('i',{style:`width:${s.score}%;background:${color}`})),h('b',null,s.score)));
  if(s.evidence.length||s.against.length){const d=h('details',null,h('summary',null,'evidências e como confirmar'));
   d.append(h('ul',null,s.evidence.map(x=>h('li',{class:'bad'},'a favor: '+x)),s.against.map(x=>h('li',{class:'ok'},'contra: '+x)),h('li',{class:'mut'},'confirmar: '+s.confirm)));c.append(d);}});
 if((V.evidence||[]).length){c.append(h('h3',null,'Evidências globais'));c.append(h('ul',null,V.evidence.map(e=>h('li',null,chip(e.kind),' '+e.txt))));}
 const sg=V.signals||{};
 c.append(h('div',{class:'sub'},`Sinais: TTFB ×${sg.ttfb_ratio??'—'} · connect ×${sg.conn_ratio??'—'} · canário ${sg.canary_failed?'falhou':'×'+(sg.canary_ratio??'—')} · erros 429/5xx ${fpc(sg.overload_err_share)} · timeouts ${fpc(sg.timeout_err_share)}`));
 app.append(c);
}
function topology(){
 const ws=M.infra.workers||[];if(!ws.length)return;
 const integ=Object.fromEntries((M.integrity||[]).map(i=>[i.id,i]));
 const Wd=Math.max(app.clientWidth-30,320),rowH=44,H=Math.max(190,ws.length*rowH+30);
 const ns='http://www.w3.org/2000/svg';const svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox',`0 0 ${Wd} ${H}`);svg.setAttribute('width','100%');
 const A=(t,a,txt,p)=>{const e=document.createElementNS(ns,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;(p||svg).appendChild(e);return e;};
 const box=(x,y,w,hh,stroke,fill)=>A('rect',{x,y,width:w,height:hh,rx:7,fill:fill||'var(--panel2)',stroke,'stroke-width':1.5});
 const cx=70,wx=Wd*.36,tx=Wd*.74;
 box(cx-60,H/2-24,120,48,'var(--info)');A('text',{x:cx,y:H/2-3,'text-anchor':'middle',style:'fill:var(--tx);font-weight:700;font-size:12px'},'Controlador');A('text',{x:cx,y:H/2+12,'text-anchor':'middle'},'orquestra · agrega');
 const L=V.layers||{};const lk=Object.keys(L);const layers=lk.length?lk:['alvo'];
 const th=Math.max(60,layers.length*30+30),ty=H/2-th/2;
 const tdeg=layers.some(k=>L[k]&&L[k].degraded);
 box(tx-10,ty,Wd-tx-6,th,tdeg?'var(--bad)':'var(--ok)');A('text',{x:tx,y:ty+16,style:'fill:var(--tx);font-weight:700;font-size:12px'},'Sistema testado');
 layers.forEach((k,i)=>{const d=L[k]&&L[k].degraded;A('text',{x:tx,y:ty+34+i*28,style:`fill:var(${d?'--bad':'--ok'})`},(d?'✖ ':'✔ ')+(LAYER_PT[k]||k)+(L[k]?` ×${L[k].max_ratio}`:''));});
 ws.forEach((w,i)=>{const y=15+i*rowH,i2=integ[w.id]||{};const bad=i2.compromised_s>0,down=w.status&&w.status!=='ok';
  const sc=down?'var(--bad)':bad?'var(--warn)':'var(--ok)';
  A('path',{d:`M${cx+60} ${H/2} C ${cx+130} ${H/2}, ${wx-80} ${y+17}, ${wx} ${y+17}`,fill:'none',stroke:'var(--line)'});
  A('path',{d:`M${wx+150} ${y+17} C ${wx+200} ${y+17}, ${tx-60} ${H/2}, ${tx-10} ${H/2}`,fill:'none',stroke:sc,'stroke-width':1.3,opacity:.8});
  box(wx,y,150,36,sc);A('text',{x:wx+8,y:y+15,style:'fill:var(--tx);font-weight:700;font-size:11.5px'},w.id+' · '+(w.region||'?'));
  A('text',{x:wx+8,y:y+28},down?('✖ '+w.status):(bad?`⚠ ${f1(i2.integrity_pct)}% íntegro`:'✔ íntegro')+` · ${f1((w.share||0)*100)}% carga`);});
 if(M.canary&&M.canary.length){A('text',{x:cx,y:H-6,'text-anchor':'middle',style:'fill:var(--info)'},'◌ canário independente → alvo');}
 app.append(h('div',{class:'card'},h('h2',null,'Topologia'),h('div',{class:'sub'},'Borda colorida = estado (✔ íntegro · ⚠ limites violados · ✖ indisponível/degradado). Layout é ilustrativo; estados são medidos.'),svg));
}
let chartHost;
function chartsSection(){
 const c=h('div',{class:'card'},h('h2',null,'Séries temporais sincronizadas'),h('div',{class:'sub'},'Passe o mouse: o cursor vale para todos os gráficos. Faixa vermelha = gerador comprometido (amostra excluída do agregado limpo) · faixa âmbar = alvo degradado · linha tracejada = joelho.'));
 chartHost=h('div');c.append(chartHost);app.append(c);renderCharts();
}
function bands(){
 const sh=[];(M.windows||[]).forEach(w=>{if(w.trusted<0.9)sh.push([w.t0,w.t1,'bad']);else if(w.degraded)sh.push([w.t0,w.t1,'warn']);});
 return {sh,marks:V.knee?[{x:V.knee.t,l:'joelho'}]:[]};
}
function renderCharts(){
 if(!chartHost)return;CHARTS.length=0;chartHost.replaceChildren();
 const S=M.series||[];if(!S.length){chartHost.append(h('p',{class:'sub'},'Sem séries (execução sem amostras).'));return;}
 const b=bands(),xmax=S.length-1,P=(f)=>S.map(s=>[s.t,f(s)]);
 const mk=(title,series,extra)=>{const d=h('div');chartHost.append(d);lineChart(d,Object.assign({title,series,xmax,shade:b.sh,marks:b.marks},extra||{}));};
 mk(`Carga planejada × efetiva (${M.unit})`,[{n:'planejada',pts:P(s=>s.plan),c:'var(--mut)',dash:'5 4'},{n:'respostas ok/s',pts:P(s=>s.ok),c:'var(--c3)'},{n:'chegadas',pts:P(s=>s.arr||null),c:'var(--c1)',w:1},{n:'descartadas',pts:P(s=>(s.drop_sched+s.drop_cap)||null),c:'var(--c4)'}],{note:M.model==='open'?'modelo ABERTO: taxa de chegada':'modelo FECHADO: usuários virtuais (VUs não são RPS)'});
